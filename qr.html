<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホで体験｜ふるさと納税くん</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px; display: grid; place-items: center; background: #eef3f8; color: #102e55; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border-radius: 24px; background: white; text-align: center; }
    h1 { font-size: 25px; line-height: 1.5; margin: 8px 0; }
    p { line-height: 1.8; font-size: 14px; }
    img { display: block; width: min(100%, 340px); height: auto; margin: 16px auto; }
    a { color: #1460b9; overflow-wrap: anywhere; }
    .start { display: block; padding: 14px; margin: 22px 0 12px; background: #102e55; border-radius: 12px; color: white; text-decoration: none; }
    small { color: #697687; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <small>ふるさと納税くん · 体験デモ</small>
    <h1>スマホのカメラで読み取って<br>そのまま体験</h1>
    <p>インストール・ログイン不要。<br>開いた画面のLINEアイコンをタップしてください。</p>
    <img src="assets/demo-qr.png" width="960" height="960" alt="ふるさと納税くんのデモを開くQRコード">
    <a href="https://komlock-lab.github.io/furusato-tax-demo/">https://komlock-lab.github.io/furusato-tax-demo/</a>
    <a class="start" href="./">この端末で体験する</a>
    <a href="assets/demo-qr.png" download="furusato-demo-qr.png">QRコード画像を保存</a>
    <p><small>実際の寄付・決済・申請は行われません。</small></p>
  </main>
</body>
</html>
